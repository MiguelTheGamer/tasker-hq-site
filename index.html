<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasker HQ</title>
<meta name="description" content="Tasker HQ is a Chrome extension that tracks your real hourly rate across AI-training gigs.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #ffffff; --text: #1f2330; --muted: #5b6070; --accent: #4f46e5; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111117; --text: #e9e9f0; --muted: #a0a3b1; --accent: #8b93ff; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 36px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Tasker HQ</h1>
  <p>A Chrome extension that tracks your real hourly rate across AI-training gigs.</p>
  <p><a href="privacy.html">Privacy policy</a> · <a href="mailto:migueldelagarza100@gmail.com">Contact</a></p>
</main>
</body>
</html>
